name: Update CERMAT exam date

on:
  schedule:
    - cron: '0 5 * * 1'   # Every Monday 05:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch CERMAT date
        run: node .github/scripts/fetch-cermat.js

      - name: Commit if changed
        run: |
          git config user.name "cermat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add projects/cermat-date.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: update CERMAT exam date [skip ci]"
            git push origin main
          fi
