# CodeQL — advanced setup (nahrazuje GitHubem spravovaný "default setup",
# který na tomto repu opakovaně padá v init kroku na interní auth chybě).
#
# DŮLEŽITÉ: po mergi tohoto souboru vypni default setup, jinak GitHub
# odmítne nahrát výsledky (konflikt konfigurací):
#   Settings → Code security and analysis → CodeQL analysis → ⋯ → Disable
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'   # pondělí ráno — týdenní sken i bez commitů

# Když na PR přijde další commit, starší běh analyzuje kód, který už
# neplatí — jeho výsledek se stejně zahodí. Bez tohohle zůstával viset ve
# frontě a rval se o runnery s tím během, na kterém záleží. Na `main` se
# neruší nic (`github.sha` je pro každý commit jiný), tam chceme mít
# analýzu ke každému commitu.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # nahrání výsledků do code scanning
      packages: read           # CodeQL packy
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Python je z matice pryč. V repu jsou tři .py soubory (nástroje na
        # zmenšování fotek, spouští se ručně na Vojtově stroji, nic z nich
        # nejde na web). Celý produkt je JavaScript v HTML. Ten druhý job
        # tedy nic nehlídal a jen zdvojnásoboval plochu, na které může CI
        # spadnout — což se 6. 8. 2026 taky stalo.
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
