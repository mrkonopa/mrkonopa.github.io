<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Únikovka: Procenta</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Vojtěch Konopa">
<meta property="og:locale" content="cs_CZ">
<meta property="og:url" content="https://mrkonopa.github.io/projects/unikovka_procenta.html">
<meta property="og:title" content="Únikovka: Procenta">
<meta property="og:description" content="Matematická úniková hra — vyřeš procenta a otevři 10 zámků.">
<meta property="og:image" content="https://mrkonopa.github.io/og-default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --gold-dark:#c89a10; --blue:#1a73c8; --blue-light:#e8f1fb;
  --green:#1e9e5a; --green-light:#e6f7ef; --red:#d63c2f;
  --purple:#7c3aad; --purple-light:#f3eefa;
  --teal:#0f8a72; --teal-light:#e4f5f1;
  --orange:#d4620a; --orange-light:#fdf0e5;
  --pink:#b5286e; --pink-light:#fce8f2;
  --indigo:#3730a3; --indigo-light:#eef2ff;
  --rose:#9f1239; --rose-light:#fff1f2;
  --cyan:#0e7490; --cyan-light:#ecfeff;
  --bg:#f5f0e6; --card:#fff; --text:#1a1a2e; --muted:#6b7280;
  --shadow:0 4px 24px rgba(0,0,0,.09); --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Lexend',sans-serif;
  background:var(--bg);
  background-image:radial-gradient(circle at 8% 15%,rgba(245,200,66,.12) 0%,transparent 38%),
    radial-gradient(circle at 92% 82%,rgba(26,115,200,.09) 0%,transparent 38%);
  min-height:100vh;color:var(--text);
}
.screen{display:none;min-height:100vh;padding:24px 16px 48px;max-width:680px;margin:0 auto}
.screen.active{display:flex;flex-direction:column;align-items:center}

/* INTRO */
#intro{justify-content:center;text-align:center;gap:18px}
#intro-content{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.chest{font-size:88px;animation:float 3s ease-in-out infinite;display:inline-block;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.15))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.title-main{font-family:'Lexend',sans-serif;font-size:2.5rem;color:var(--blue);line-height:1.1;font-weight:700}
.title-sub{font-family:'Lexend',sans-serif;font-size:1.45rem;color:var(--gold-dark);font-weight:600}
.intro-card{background:var(--card);border-radius:var(--radius);padding:22px 26px;
  box-shadow:var(--shadow);border-left:6px solid var(--blue);text-align:left;width:100%}
.intro-card p{font-size:.97rem;line-height:1.75}
.intro-card p+p{margin-top:10px}
.intro-card b{color:var(--blue)}
.rules{background:var(--card);border-radius:var(--radius);padding:18px 22px;
  box-shadow:var(--shadow);width:100%;border-left:6px solid var(--gold-dark)}
.rules h3{font-family:'Lexend',sans-serif;color:var(--gold-dark);font-size:1.05rem;margin-bottom:10px;font-weight:600}
.rules ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;align-items:flex-start;gap:10px;font-size:.95rem;line-height:1.55}
.btn-primary{
  background:linear-gradient(135deg,var(--blue),#1250a0);
  color:#fff;
  font-family:'Lexend',sans-serif;
  font-size:1.2rem;font-weight:700;
  border:none;border-radius:50px;padding:15px 46px;
  cursor:pointer;box-shadow:0 6px 20px rgba(26,115,200,.32);
  transition:transform .15s,box-shadow .15s;
  letter-spacing:0.01em;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(26,115,200,.38)}

/* PROGRESS */
.progress-wrap{width:100%;margin-top:10px;margin-bottom:18px}
.progress-label{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:5px}
.progress-bar{background:#ddd8c6;border-radius:20px;height:9px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .5s ease}
.stars-wrap{display:flex;gap:3px}
.star{font-size:1rem;opacity:.22;transition:opacity .3s,transform .3s}
.star.lit{opacity:1;transform:scale(1.12)}

/* GAME */
#game{justify-content:flex-start;gap:0}
.lock-header{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.lock-icon-big{font-size:2.2rem}
.lock-title{font-family:'Lexend',sans-serif;font-size:1.4rem;font-weight:600}
.lock-badge{margin-left:auto;background:var(--blue);color:#fff;border-radius:50px;
  padding:3px 13px;font-size:.82rem;font-weight:700;white-space:nowrap}
.task-card{background:var(--card);border-radius:var(--radius);padding:22px 22px 18px;
  box-shadow:var(--shadow);width:100%;margin-bottom:22px;position:relative;overflow:hidden}
.task-card::before{content:'';position:absolute;top:0;left:0;width:5px;height:100%;border-radius:3px 0 0 3px}
.task-card.blue::before{background:var(--blue)}
.task-card.green::before{background:var(--green)}
.task-card.purple::before{background:var(--purple)}
.task-card.teal::before{background:var(--teal)}
.task-card.orange::before{background:var(--orange)}
.task-card.pink::before{background:var(--pink)}
.task-card.indigo::before{background:var(--indigo)}
.task-card.rose::before{background:var(--rose)}
.task-card.cyan::before{background:var(--cyan)}
.task-card.gold::before{background:var(--gold-dark)}
.task-card h3{font-family:'Lexend',sans-serif;font-size:1.02rem;margin-bottom:11px;font-weight:700}
.task-card.blue h3{color:var(--blue)} .task-card.green h3{color:var(--green)}
.task-card.purple h3{color:var(--purple)} .task-card.teal h3{color:var(--teal)}
.task-card.orange h3{color:var(--orange)} .task-card.pink h3{color:var(--pink)}
.task-card.indigo h3{color:var(--indigo)} .task-card.rose h3{color:var(--rose)}
.task-card.cyan h3{color:var(--cyan)} .task-card.gold h3{color:var(--gold-dark)}
.task-card p{font-size:.95rem;line-height:1.75}
.task-card p+p{margin-top:8px}
.hint-box{margin-top:11px;background:#fef9ec;border:1.5px dashed var(--gold-dark);
  border-radius:10px;padding:9px 13px;font-size:.88rem;color:#7a5200;display:none}
.hint-box.show{display:block}
.hint-btn{background:none;border:1.5px solid var(--gold-dark);color:var(--gold-dark);
  border-radius:20px;padding:4px 12px;font-size:.8rem;font-weight:700;cursor:pointer;
  margin-top:9px;font-family:'Lexend',sans-serif;transition:background .15s}
.hint-btn:hover{background:#fef9ec}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:.78rem;font-weight:700;margin-bottom:7px}
.tag.blue{background:var(--blue-light);color:var(--blue)}
.tag.green{background:var(--green-light);color:var(--green)}
.tag.purple{background:var(--purple-light);color:var(--purple)}
.tag.teal{background:var(--teal-light);color:var(--teal)}
.tag.orange{background:var(--orange-light);color:var(--orange)}
.tag.pink{background:var(--pink-light);color:var(--pink)}
.tag.indigo{background:var(--indigo-light);color:var(--indigo)}
.tag.rose{background:var(--rose-light);color:var(--rose)}
.tag.cyan{background:var(--cyan-light);color:var(--cyan)}
.tag.gold{background:#fef9ec;color:var(--gold-dark)}

/* CODE INPUT */
.code-wrap{background:var(--card);border-radius:var(--radius);padding:20px 22px;
  box-shadow:var(--shadow);width:100%;margin-top:10px;margin-bottom:18px}
.code-wrap label{display:block;font-family:'Lexend',sans-serif;font-size:.98rem;color:var(--muted);
  margin-bottom:11px;font-weight:700}
.code-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* Tabulky v učební části mají až 11 sloupců a na úzký displej se
   nevejdou. Karta má `overflow:hidden`, takže se konec tabulky TIŠE
   OŘÍZNE — u „druhých mocnin" tak dítě nevidí sloupec 10 (100) přímo
   pod větou, že se ta čísla vyplatí znát nazpaměť, a nemá jak ho
   zobrazit. Na úzku proto radši vodorovné posouvání.
   Jen pod 520 px, aby se vykreslení na širokém displeji nezměnilo. */
@media (max-width:520px){.task-card{overflow-x:auto}}
.code-hint-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.code-hint-btn{background:none;border:1.5px dashed var(--gold-dark);color:var(--gold-dark);
  padding:5px 14px;border-radius:20px;font-family:'Lexend',sans-serif;font-weight:600;font-size:.82rem;
  cursor:pointer;transition:all .15s}
.code-hint-btn:hover:not([disabled]){background:#fef9ec}
.code-hint-btn[disabled]{opacity:.5;cursor:not-allowed;border-style:solid;border-color:#e0dbd0;color:var(--muted)}
.code-hint-counter{font-size:.76rem;color:var(--muted)}
.code-hint-counter .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0dbd0;margin:0 1px}
.code-hint-counter .dot.shown{background:var(--gold-dark)}
.code-hint-counter .dot.shown.warn{background:var(--orange)}
.code-hint-box{margin-top:10px;background:#fef9ec;border-left:3px solid var(--gold-dark);
  padding:10px 14px;border-radius:8px;font-size:.9rem;display:none;color:#7a5200}
.code-hint-box.show{display:block}
.code-hint-box .h-label{font-size:.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--gold-dark);display:block;margin-bottom:4px}
.code-hint-box[data-level="3"]{background:var(--orange-light);border-left-color:var(--orange);color:#8b3f08}
.code-hint-box[data-level="3"] .h-label{color:var(--orange)}
.code-input{flex:1;min-width:0;font-family:'Lexend',sans-serif;font-size:1.5rem;text-align:center;
  letter-spacing:.12em;border:3px solid #ccc8bb;border-radius:12px;padding:11px 14px;
  outline:none;transition:border-color .2s;background:#fafaf6;color:var(--text)}
.code-input:focus{border-color:var(--blue);background:#fff}
.code-input.error{border-color:var(--red);animation:shake .32s}
.code-input.success{border-color:var(--green);background:var(--green-light)}
@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
.btn-check{
  background:linear-gradient(135deg,var(--blue),#1250a0);color:#fff;
  font-family:'Lexend',sans-serif;font-size:.95rem;font-weight:700;
  border:none;border-radius:12px;padding:13px 20px;
  cursor:pointer;box-shadow:0 4px 14px rgba(26,115,200,.28);
  transition:transform .15s;white-space:nowrap;
}
.btn-check:hover{transform:translateY(-1px)}
.feedback{margin-top:9px;font-weight:700;font-size:.92rem;min-height:20px}
.feedback.ok{color:var(--green)} .feedback.err{color:var(--red)}
.unlock-anim{display:none;flex-direction:column;align-items:center;gap:6px;padding:18px;
  animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}
.unlock-anim.show{display:flex}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.unlock-anim .big-icon{font-size:3.2rem}
.unlock-anim p{font-family:'Lexend',sans-serif;font-size:1.05rem;color:var(--green);text-align:center;font-weight:700}

/* TABLE */
table.tt{width:100%;border-collapse:collapse;margin:10px 0;font-size:.9rem}
table.tt th{padding:7px 9px;text-align:center;font-weight:700}
table.tt td{border:1px solid #e0dbd0;padding:7px 9px;text-align:center}
table.tt tr:nth-child(even) td{background:#fafaf5}
.blue table.tt th{background:var(--blue-light);color:var(--blue)}
.green table.tt th{background:var(--green-light);color:var(--green)}
.purple table.tt th{background:var(--purple-light);color:var(--purple)}
.teal table.tt th{background:var(--teal-light);color:var(--teal)}
.orange table.tt th{background:var(--orange-light);color:var(--orange)}
.pink table.tt th{background:var(--pink-light);color:var(--pink)}
.indigo table.tt th{background:var(--indigo-light);color:var(--indigo)}
.rose table.tt th{background:var(--rose-light);color:var(--rose)}
.cyan table.tt th{background:var(--cyan-light);color:var(--cyan)}
.gold table.tt th{background:#fef9ec;color:var(--gold-dark)}

/* FINISH */
#finish{justify-content:center;text-align:center;gap:20px}
.final-chest{font-size:96px;animation:bounce .6s cubic-bezier(.175,.885,.32,1.275)}
@keyframes bounce{from{transform:scale(0)}to{transform:scale(1)}}
.final-title{font-family:'Lexend',sans-serif;font-size:2.1rem;color:var(--gold-dark);font-weight:800}
.final-sub{font-size:.97rem;color:var(--muted);line-height:1.75;max-width:420px}
.summary-card{background:var(--card);border-radius:var(--radius);padding:18px 22px;
  box-shadow:var(--shadow);width:100%;text-align:left}
.summary-card h3{font-family:'Lexend',sans-serif;color:var(--blue);font-size:1.05rem;margin-bottom:12px;font-weight:700}
.summary-row{display:flex;align-items:flex-start;gap:11px;padding:9px 0;
  border-bottom:1px solid #f0ece0;font-size:.93rem;line-height:1.6}
.summary-row:last-child{border-bottom:none}
.s-icon{font-size:1.2rem;flex-shrink:0;margin-top:1px}
.confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.top-bar{max-width:680px;margin:0 auto;padding:16px 20px 0;display:flex;justify-content:space-between;gap:18px;font-size:.82rem;color:var(--muted);font-family:'Lexend',sans-serif}
.top-bar a{color:var(--muted);text-decoration:none}
.top-bar a:hover{color:var(--blue)}
.top-bar .crumb{color:var(--text);font-weight:500}
#lang-bar{position:fixed;bottom:16px;right:16px;z-index:200;display:flex;gap:6px}
.lang-btn{background:#fff;border:1.5px solid #e0dbd0;border-radius:8px;
  padding:4px 8px;font-size:1.1rem;cursor:pointer;transition:border-color .12s,box-shadow .12s;
  line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.lang-btn:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(26,115,200,.2)}
.lang-btn.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,115,200,.25)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.chest{animation:none!important}.confetti-piece{display:none!important}}
/* mobil: dotykové plochy nav/jazyk na ≥44px */
@media(pointer:coarse){.lang-btn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}.tp-back,.tp-home{display:inline-flex;align-items:center;min-height:44px}}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Únikovka z matiky — Procenta</h1>

<div id="lang-bar">
  <button class="lang-btn active" data-lang="cs" onclick="setLang('cs')">&#x1F1E8;&#x1F1FF;</button>
  <button class="lang-btn" data-lang="en" onclick="setLang('en')">&#x1F1EC;&#x1F1E7;</button>
</div>

<div class="top-bar">
  <a href="./" class="tp-back">← zpět na projekty</a>
  <span class="crumb">/projects/unikovka_procenta</span>
  <a href="/" class="tp-home">domů</a>
</div>

<!-- INTRO -->
<div id="intro" class="screen active">
  <div id="intro-content"></div>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="progress-wrap" style="width:100%">
    <div class="progress-label">
      <span id="prog-label">Zámek 1 z 10</span>
      <span class="stars-wrap" id="stars-wrap"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div id="step-container" style="width:100%"></div>
</div>

<!-- FINISH -->
<div id="finish" class="screen">
  <div class="confetti-wrap" id="confetti"></div>
  <div id="finish-content"></div>
</div>

<script>
/* ─── i18n ───────────────────────────────────────────────────────────── */
const LANG_KEY = 'unikovka_procenta_lang';
let lang = localStorage.getItem(LANG_KEY) || 'cs';
const i18n = (cs, en) => lang === 'en' ? en : cs;

function setLang(l) {
  lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === l));
  document.querySelectorAll('.tp-back').forEach(el =>
    el.textContent = i18n('← zpět na projekty', '← back to projects'));
  document.querySelectorAll('.tp-home').forEach(el =>
    el.textContent = i18n('domů', 'home'));
  const activeId = document.querySelector('.screen.active')?.id;
  if (activeId === 'intro') buildIntro();
  else if (activeId === 'game') render(cur);
  else if (activeId === 'finish') buildFinish();
}

function buildIntro() {
  document.getElementById('intro-content').innerHTML = `
    <div class="chest">🏴‍☠️</div>
    <div class="title-main">${i18n('Únikovka z matiky','Math Escape Room')}</div>
    <div class="title-sub">⚡ ${i18n('PROCENTA','PERCENTAGES')} ⚡</div>
    <div class="intro-card">
      <p>${i18n('Před tebou je <b>truhla s pokladem</b> – uzamčena <b>10 zámky</b>.','Before you lies a <b>treasure chest</b> – locked with <b>10 locks</b>.')}</p>
      <p>${i18n('Každý zámek se odemkne správným kódem. Výpočty dělej <b>do sešitu</b>, kód zadej sem.','Each lock opens with the correct code. Do your calculations <b>in a notebook</b>, then enter the code here.')}</p>
      <p>${i18n('Žádné kalkulačky – dnes přijdeš na to, jak procenta fungují <b>vlastní hlavou</b> 🧠','No calculators – today you\'ll figure out how percentages work <b>on your own</b> 🧠')}</p>
    </div>
    <div class="rules">
      <h3>📋 ${i18n('Pravidla','Rules')}</h3>
      <ul>
        <li><span>✏️</span> ${i18n('Výpočty piš do sešitu – každý příklad celý.','Write your calculations in a notebook – show every step.')}</li>
        <li><span>🚫</span> ${i18n('Bez kalkulačky, bez opisování.','No calculator, no copying.')}</li>
        <li><span>💡</span> ${i18n('Nevíš? Zkus nápovědu – ale nejdřív se zamysli!','Stuck? Try a hint – but think first!')}</li>
        <li><span>🔢</span> ${i18n('Kód zadej jako číslo (bez mezer, bez %).','Enter the code as a number (no spaces, no %).')}</li>
      </ul>
    </div>
    <button class="btn-primary" id="btn-start">${i18n('🔓 Začít dobrodružství!','🔓 Start the adventure!')}</button>
  `;
  document.getElementById('btn-start').addEventListener('click', startGame);
}

function buildFinish() {
  document.getElementById('finish-content').innerHTML = `
    <div class="final-chest">🏆</div>
    <div class="final-title">${i18n('Poklad je tvůj!','The treasure is yours!')}</div>
    <p class="final-sub">${i18n('Zvládl(a) jsi všech 10 zámků a pronikl(a) do tajemství procent. Gratulace!','You cracked all 10 locks and unlocked the secrets of percentages. Congratulations!')}</p>
    <div class="summary-card">
      <h3>📖 ${i18n('Co jsi dnes objevil(a)','What you discovered today')}</h3>
      <div class="summary-row"><span class="s-icon">1️⃣</span><span>${i18n('1 % = 1 setina celku = základ ÷ 100','1% = 1 hundredth of the whole = base ÷ 100')}</span></div>
      <div class="summary-row"><span class="s-icon">2️⃣</span><span>${i18n('n % ze základu = (základ ÷ 100) × n','n% of base = (base ÷ 100) × n')}</span></div>
      <div class="summary-row"><span class="s-icon">3️⃣</span><span>${i18n('Procento = zlomek = desetinné číslo (25 % = 25/100 = 0,25)','Percent = fraction = decimal (25% = 25/100 = 0.25)')}</span></div>
      <div class="summary-row"><span class="s-icon">4️⃣</span><span>${i18n('Kolik procent? → část ÷ celek × 100','How many percent? → part ÷ whole × 100')}</span></div>
    </div>
    <button class="btn-primary" id="btn-restart">${i18n('🔄 Hrát znovu','🔄 Play again')}</button>
  `;
  document.getElementById('btn-restart').addEventListener('click', () => location.reload());
}

const STEPS = [
{
  id:1, color:'blue', icon:'🔵',
  title:'Zámek 1 – Co je to 1 %?', title_en:'Lock 1 – What is 1%?',
  tag:'Definice procenta', tag_en:'Definition of percent', tagClass:'blue',

  10: ['Tři úlohy najednou: procentová část, počet procent, převod desetinného čísla.', 'a) 150 % ze 40 = 60. b) 8 ÷ 25 × 100 = 32. c) 0,37 × 100 = 37.', '60 + 32 + 37 = <b>129</b>.'],
};
const CODE_HINTS_EN = {
  1: ['This problem asks: 1% of 700. What operation gives you one hundredth?', '1% = base ÷ 100. So 700 ÷ 100 = ?', '700 ÷ 100 = 7. Code: <b>7</b>.'],
  2: ['Find 1% for each number, multiply by the percentage, then add up.', 'a) 1% of 600 = 6, ×5 = 30. b) 1% of 500 = 5, ×20 = 100.', '30 + 100 = <b>130</b>.'],
  3: ['Find 1% and multiply, or use the shortcut — 50% is half.', 'a) 2% of 500 = 10. b) 50% of 200 = half = 100.', '10 + 100 = <b>110</b>.'],
  4: ['Percent → decimal: move the point 2 places left. Then add up and ×100.', '40%=0.40; 5%=0.05; 200%=2.00. Add them up.', '0.40 + 0.05 + 2.00 = 2.45. ×100 = <b>245</b>.'],
  5: ['With a fraction X/100, the numerator directly = percentage.', '119/100 = 119%. 700/100 = 700%. Add them up.', '119 + 700 = <b>819</b>.'],
  6: ['50% is half the whole, 25% is a quarter. Calculate both and add up.', 'a) 50% of 20 = 10. b) 25% of 20 = 5.', '10 + 5 = <b>15</b>.'],
  7: ['Decimal × 100 = percentage. Move the point 2 places right.', '0.75 × 100 = 75. 2.4 × 100 = 240.', '75 + 240 = <b>315</b>.'],
  8: ['Formula: <b>part ÷ whole × 100 = percentage</b>.', '6 ÷ 30 × 100 = ?', '6 ÷ 30 × 100 = <b>20</b>%.'],
  9: ['Three problems — calculate the percentage part for each and add up.', 'a) 30% of 400 = 120. b) 20% of 500 = 100. c) 1% of 1 000 = 10.', '120 + 100 + 10 = <b>230</b>.'],
  10: ['Three problems: percentage part, number of percent, converting a decimal.', 'a) 150% of 40 = 60. b) 8 ÷ 25 × 100 = 32. c) 0.37 × 100 = 37.', '60 + 32 + 37 = <b>129</b>.'],
};

let codeHintLevel = 0;

function advanceCodeHint() {
  if (codeHintLevel >= 3) return;
  codeHintLevel++;
  const CODE_HINTS = lang === 'en' ? CODE_HINTS_EN : CODE_HINTS_CS;
  const fallback = i18n(
    ['Čti si pozorně postup nahoře.', 'Postupně spočítej, co se ptá.', 'Výsledek vyplyne z výpočtu.'],
    ['Read the instructions above carefully.', 'Work through the problem step by step.', 'The result follows from the calculation.']
  );
  const hints = CODE_HINTS[STEPS[cur].id] || fallback;
  const box = document.getElementById('ch-box');
  const btn = document.getElementById('ch-btn');
  const counter = document.getElementById('ch-counter');
  if (!box || !btn) return;
  box.classList.add('show');
  box.dataset.level = codeHintLevel;
  const labels = i18n(['Nasměrování','Vzorec','Postup s výsledkem'],['Direction','Formula','Solution steps']);
  box.innerHTML = `<span class="h-label">${i18n('Nápověda','Hint')} ${codeHintLevel}/3 — ${labels[codeHintLevel-1]}</span>${hints[codeHintLevel-1]}`;
  if (counter) {
    counter.querySelectorAll('.dot').forEach((d,i) => {
      d.classList.toggle('shown', i < codeHintLevel);
      if (i === 2 && codeHintLevel === 3) d.classList.add('warn');
    });
  }
  if (codeHintLevel < 3) {
    btn.textContent = i18n(`💡 Další nápověda ${codeHintLevel+1}/3`, `💡 Next hint ${codeHintLevel+1}/3`);
  } else {
    btn.disabled = true;
    btn.textContent = i18n('💡 Všechny nápovědy ukázány','💡 All hints shown');
  }
}

let cur = 0;
let att = new Array(STEPS.length).fill(0);

function startGame() {
  document.getElementById('intro').classList.remove('active');
  document.getElementById('game').classList.add('active');
  document.getElementById('stars-wrap').innerHTML =
    STEPS.map((_,i) => `<span class="star" id="s${i}">⭐</span>`).join('');
  render(0);
}

function render(idx) {
  cur = idx;
  codeHintLevel = 0;
  const s = STEPS[idx];
  document.getElementById('prog-label').textContent = i18n(`Zámek ${idx+1} z ${STEPS.length}`,`Lock ${idx+1} of ${STEPS.length}`);
  document.getElementById('prog-fill').style.width = `${(idx / STEPS.length) * 100}%`;
  for (let i = 0; i < STEPS.length; i++) {
    const el = document.getElementById(`s${i}`);
    if (el) el.classList.toggle('lit', i < idx);
  }

  const colorMap = {
    blue:'--blue',green:'--green',purple:'--purple',teal:'--teal',
    orange:'--orange',pink:'--pink',indigo:'--indigo',rose:'--rose',
    cyan:'--cyan',gold:'--gold-dark'
  };
  const cv = colorMap[s.color] || '--blue';

  const tasksHTML = s.tasks.map(t => `
    <div class="task-card ${s.color}">
      <span class="tag ${s.tagClass}">${i18n(s.tag, s.tag_en)}</span>
      <h3>${i18n(t.title, t.title_en)}</h3>
      ${i18n(t.body, t.body_en)}
      <button class="hint-btn" onclick="toggleHint(this)">${i18n('💡 Potřebuji nápovědu','💡 I need a hint')}</button>
      <div class="hint-box">${i18n(t.hint, t.hint_en)}</div>
    </div>
  `).join('');

  document.getElementById('step-container').innerHTML = `
    <div class="lock-header">
      <span class="lock-icon-big">${s.icon}</span>
      <span class="lock-title" style="color:var(${cv})">${i18n(s.title, s.title_en)}</span>
      <span class="lock-badge">${idx+1}/${STEPS.length}</span>
    </div>
    ${tasksHTML}
    <div class="code-wrap">
      <label>🔐 ${i18n(`Zadej kód zámku ${idx+1}:`,`Enter lock ${idx+1} code:`)}</label>
      <div class="code-row">
        <input type="number" class="code-input" id="ci" placeholder="???"
          onkeydown="if(event.key==='Enter') chk()">
        <button class="btn-check" onclick="chk()">${i18n('Odemknout 🔓','Unlock 🔓')}</button>
      </div>
      <div class="code-hint-bar">
        <button class="code-hint-btn" id="ch-btn" onclick="advanceCodeHint()">💡 ${i18n('Nápověda ke kódu 1/3','Code hint 1/3')}</button>
        <span class="code-hint-counter" id="ch-counter">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
      </div>
      <div class="code-hint-box" id="ch-box" data-level="0"></div>
      <div class="feedback" id="fb"></div>
    </div>
    <div class="unlock-anim" id="ua">
      <div class="big-icon">🔓✨</div>
      <p>${i18n(s.successMsg, s.successMsg_en)}</p>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleHint(btn) {
  const h = btn.nextElementSibling;
  h.classList.toggle('show');
  btn.textContent = h.classList.contains('show')
    ? i18n('🙈 Skrýt nápovědu','🙈 Hide hint')
    : i18n('💡 Potřebuji nápovědu','💡 I need a hint');
}

function chk() {
  const inp = document.getElementById('ci');
  const fb  = document.getElementById('fb');
  att[cur]++;

  if (inp.value.trim() === STEPS[cur].code) {
    inp.classList.remove('error');
    inp.classList.add('success');
    fb.textContent = '';
    document.getElementById('ua').classList.add('show');
    setTimeout(() => {
      if (cur < STEPS.length - 1) render(cur + 1);
      else finish();
    }, 1900);
  } else {
    inp.classList.add('error');
    inp.classList.remove('success');
    setTimeout(() => inp.classList.remove('error'), 380);
    const msgs = i18n(
      ['Hmm, to není ono. Zkontroluj postup!','Zkus to znovu – možná jiný výpočet?','Nevzdávej se! Přečti si nápovědu.','Ještě jednou, jsi blízko!'],
      ['Hmm, not quite. Check your working!','Try again – maybe a different calculation?','Don\'t give up! Read the hint.','One more try, you\'re close!']
    );
    fb.className = 'feedback err';
    fb.textContent = msgs[Math.min(att[cur] - 1, msgs.length - 1)];
  }
}

function finish() {
  document.getElementById('game').classList.remove('active');
  document.getElementById('finish').classList.add('active');
  buildFinish();
  const wrap = document.getElementById('confetti');
  const cols = ['#f5c842','#1a73c8','#1e9e5a','#e74c3c','#7c3aad','#0f8a72','#ff7f50','#b5286e'];
  for (let i = 0; i < 90; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const sz = 6 + Math.random() * 9;
    el.style.cssText = `
      left:${Math.random()*100}%;top:-12px;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      width:${sz}px;height:${sz}px;
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation:fall ${1.5+Math.random()*2.5}s ${Math.random()*1.5}s linear forwards;
    `;
    wrap.appendChild(el);
  }
}

// Init
document.querySelectorAll('.lang-btn').forEach(b =>
  b.classList.toggle('active', b.dataset.lang === lang));
buildIntro();
</script>
</body>
</html>
