<!DOCTYPE html>
<html lang="cs"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goniometrie — sin, cos, tan (9. třída)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f0e6; --card:#fff; --text:#1a1a2e; --muted:#6b7280;
  --border:#e2dccc; --shadow:0 2px 14px rgba(0,0,0,.06); --radius:14px;
  --sans:'Lexend','Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --ch1:#0f8a72; --ch1-bg:#e4f5f1;
  --ch2:#1a73c8; --ch2-bg:#e8f1fb;
  --ch3:#7c3aad; --ch3-bg:#f3eefa;
  --ch4:#b15a1f; --ch4-bg:#fbeee2;
  --ch5:#0e7c8a; --ch5-bg:#e1f3f5;
  --ch6:#5b3aad; --ch6-bg:#ece4f7;
  --ch7:#a08312; --ch7-bg:#f7f0d4;
  --red:#d63c2f; --red-bg:#fdecea;
  --green:#1e9e5a; --green-bg:#e6f7ef;
  --gold:#c89a10; --gold-bg:#fef9ec;
  --orange:#d4620a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--sans);background:var(--bg);
  background-image:radial-gradient(circle at 8% 12%,rgba(15,138,114,.10) 0%,transparent 38%),
    radial-gradient(circle at 92% 88%,rgba(26,115,200,.07) 0%,transparent 38%);
  color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--ch2);text-decoration:none}a:hover{color:#1250a0}
.screen{display:none;max-width:720px;margin:0 auto;padding:20px 18px 60px}
.screen.active{display:block}
.top-bar{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;
  gap:18px;padding-bottom:10px;align-items:center}
.top-bar a{color:var(--muted)}.top-bar a:hover{color:var(--ch2)}
.btn-primary{display:block;width:100%;max-width:340px;margin:18px auto 0;padding:14px 24px;
  border:none;border-radius:10px;cursor:pointer;font-family:var(--sans);font-size:1.05rem;
  font-weight:700;background:linear-gradient(135deg,var(--ch2),#1250a0);color:#fff;
  transition:transform .12s,box-shadow .12s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(26,115,200,.35)}
.btn-check{padding:10px 22px;border:none;border-radius:8px;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:.95rem;
  background:var(--ch2);color:#fff;transition:background .12s}
.btn-check:hover{background:#1250a0}
.card{background:var(--card);border-radius:var(--radius);padding:20px 22px;
  margin-bottom:16px;box-shadow:var(--shadow);border-left:4px solid var(--border)}
.card h3{font-size:1.05rem;font-weight:700;margin-bottom:10px}
.card ul{padding-left:0;list-style:none}.card ul li{padding:4px 0;display:flex;gap:10px}
.bullet{font-weight:700;flex-shrink:0}
.fact-box{background:#e4f5f1;border:1.5px solid #0f8a72;border-radius:10px;
  padding:12px 16px;margin:14px 0;font-size:.93rem;line-height:1.7}
.warn-box{background:var(--gold-bg);border:1.5px solid var(--gold);border-radius:10px;
  padding:12px 16px;margin:14px 0;font-size:.93rem;line-height:1.7}
#intro{text-align:center;padding-top:24px}
#intro .top-bar{text-align:left}
.intro-icon{font-size:64px;margin-bottom:8px;display:inline-block}
.intro-title{font-weight:800;font-size:clamp(24px,4.5vw,38px);line-height:1.1;
  letter-spacing:-.02em;margin-bottom:10px}
.intro-title .accent{color:var(--ch1)}
.intro-sub{color:var(--muted);font-size:.97rem;max-width:500px;margin:0 auto 18px}
.code-row{display:flex;gap:10px;margin-top:10px}
.code-row input{flex:1;padding:10px 14px;border:1.5px solid var(--border);
  border-radius:8px;font-family:var(--sans);font-size:.95rem}
.code-row input:focus{outline:2px solid var(--ch2);border-color:transparent}
.code-feedback{font-size:.88rem;margin-top:8px;min-height:1.4em}
.code-feedback.ok{color:var(--green)}.code-feedback.err{color:var(--red)}
.hub-title{text-align:center;font-weight:800;font-size:1.5rem;margin-bottom:6px}
.hub-sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:20px}
.hub-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:24px}
.hub-card{background:var(--card);border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;
  cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .12s}
.hub-card:hover:not(.locked){transform:translateY(-2px);border-color:var(--ch2)}
.hub-card.locked{opacity:.55;cursor:not-allowed}.hub-card.done{border-color:var(--green)}
.hub-icon{font-size:32px;flex-shrink:0}
.hub-meta h3{font-size:1rem;font-weight:700;margin-bottom:2px}
.hub-meta p{font-size:.85rem;color:var(--muted)}
.hub-badge{margin-left:auto;font-size:.78rem;font-weight:700;padding:3px 10px;
  border-radius:20px;flex-shrink:0}
.hub-badge.open{background:var(--ch2-bg);color:var(--ch2)}
.hub-badge.done{background:var(--green-bg);color:var(--green)}
.hub-badge.locked{background:#f0ece4;color:var(--muted)}
.chapter-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.chapter-badge{font-size:.78rem;font-weight:700;padding:4px 12px;border-radius:20px}
.chapter-badge.ch1{background:var(--ch1-bg);color:var(--ch1)}
.chapter-badge.ch2{background:var(--ch2-bg);color:var(--ch2)}
.chapter-badge.ch3{background:var(--ch3-bg);color:var(--ch3)}
.chapter-badge.ch4{background:var(--ch4-bg);color:var(--ch4)}
.chapter-badge.ch5{background:var(--ch5-bg);color:var(--ch5)}
.chapter-badge.ch6{background:var(--ch6-bg);color:var(--ch6)}
.chapter-badge.ch7{background:var(--ch7-bg);color:var(--ch7)}
.scene-progress{font-size:.82rem;color:var(--muted)}
.progress-bar{height:6px;background:#e2dccc;border-radius:10px;margin-bottom:20px;overflow:hidden}
.progress-fill{height:100%;border-radius:10px;transition:width .4s ease;
  background:linear-gradient(90deg,var(--ch2),var(--ch1))}
.scene-card{background:var(--card);border-radius:var(--radius);padding:22px 24px;
  box-shadow:var(--shadow);margin-bottom:16px}
.scene-card h2{font-size:1.15rem;font-weight:700;margin-bottom:14px}
.svg-wrap{text-align:center;margin:16px 0}
.formula-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.formula-card{border-radius:10px;padding:14px 10px;text-align:center;border:2px solid transparent}
.formula-card .fname{font-size:.75rem;font-weight:700;text-transform:uppercase;margin-bottom:4px}
.formula-card .fval{font-size:1.1rem;font-weight:700}
.formula-card .fwords{font-size:.72rem;color:var(--muted);margin-top:4px}
.fsin{background:var(--ch1-bg);border-color:var(--ch1)}.fsin .fname{color:var(--ch1)}
.fcos{background:var(--ch2-bg);border-color:var(--ch2)}.fcos .fname{color:var(--ch2)}
.ftan{background:var(--ch3-bg);border-color:var(--ch3)}.ftan .fname{color:var(--ch3)}
.choice-list{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.choice-btn{padding:12px 18px;border:1.5px solid var(--border);border-radius:10px;
  background:#fff;cursor:pointer;text-align:left;font-family:var(--sans);font-size:.97rem;
  transition:border-color .12s,background .12s}
.choice-btn:hover:not(:disabled){border-color:var(--ch2);background:var(--ch2-bg)}
.choice-btn.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.choice-btn.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.problem-q{font-size:1.05rem;font-weight:600;margin:14px 0 12px;line-height:1.6}
.input-row{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.answer-input{width:110px;padding:10px 14px;border:1.5px solid var(--border);
  border-radius:8px;font-family:var(--sans);font-size:1.05rem;text-align:center}
.answer-input:focus{outline:2px solid var(--ch2);border-color:transparent}
.unit-label{font-size:.95rem;color:var(--muted)}
.feedback{margin:10px 0;padding:10px 14px;border-radius:8px;font-size:.93rem;display:none}
.feedback.ok{background:var(--green-bg);color:var(--green);display:block}
.feedback.err{background:var(--red-bg);color:var(--red);display:block}
.hint-section{margin-top:14px}
.hint-btn{background:none;border:1.5px solid var(--gold);color:var(--gold);
  padding:7px 16px;border-radius:8px;cursor:pointer;font-family:var(--sans);
  font-size:.88rem;transition:background .12s}
.hint-btn:hover{background:var(--gold-bg)}.hint-btn:disabled{opacity:.5;cursor:default}
.hint-box{margin-top:10px;background:var(--gold-bg);border:1.5px dashed var(--gold);
  border-radius:10px;padding:12px 16px;font-size:.91rem;display:none}
.hint-box.l3{background:#fdf0e5;border-color:var(--orange);color:#7a3000}
.hint-box.visible{display:block}
.btn-next{display:none;width:100%;max-width:300px;margin:18px auto 0;padding:12px 24px;
  border:none;border-radius:10px;cursor:pointer;font-family:var(--sans);font-size:1rem;
  font-weight:700;background:linear-gradient(135deg,var(--ch1),var(--ch2));color:#fff;
  transition:transform .12s}
.btn-next.visible{display:block}.btn-next:hover{transform:translateY(-2px)}
.code-reveal{background:var(--ch1-bg);border:2px solid var(--ch1);border-radius:12px;
  padding:18px 20px;margin:20px 0;text-align:center;display:none}
.code-reveal.visible{display:block}
.code-reveal h3{color:var(--ch1);margin-bottom:8px}
.code-val{font-size:1.4rem;font-weight:800;letter-spacing:.08em;color:var(--ch1);
  background:#fff;padding:8px 20px;border-radius:8px;display:inline-block;margin:6px 0}
.code-reveal p{font-size:.85rem;color:var(--muted)}
.cert{background:var(--card);border-radius:var(--radius);padding:30px 24px;
  text-align:center;box-shadow:var(--shadow);margin-bottom:20px}
.cert-seal{font-size:64px;margin-bottom:10px}
.cert-title{font-size:1.8rem;font-weight:800;margin:10px 0 6px}
.cert-sub{color:var(--muted);font-size:.95rem}
.cert-score{font-size:2rem;font-weight:800;color:var(--ch2);margin:14px 0 6px}
.cert-name-input input{padding:10px 16px;border:1.5px solid var(--border);
  border-radius:8px;font-family:var(--sans);font-size:1rem;margin:8px 0;
  text-align:center;width:100%;max-width:280px}
@media(max-width:520px){.formula-grid{grid-template-columns:1fr}}
/* ── lang bar ── */
#lang-bar{position:fixed;bottom:16px;right:16px;z-index:200;display:flex;gap:6px}
.lang-btn{background:#fff;border:1.5px solid var(--border);border-radius:8px;
  padding:4px 8px;font-size:1.1rem;cursor:pointer;transition:border-color .12s,box-shadow .12s;
  line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.lang-btn:hover{border-color:var(--ch2);box-shadow:0 2px 8px rgba(26,115,200,.2)}
.lang-btn.active{border-color:var(--ch2);box-shadow:0 0 0 2px rgba(26,115,200,.25)}
</style>
</head>
<body>

<!-- LANG BAR -->
<div id="lang-bar">
  <button class="lang-btn active" data-lang="cs" onclick="setLang('cs')">🇨🇿</button>
  <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧</button>
</div>

<!-- INTRO -->
<section id="intro" class="screen active">
  <div class="top-bar" id="intro-topbar"></div>
  <div id="intro-dynamic"></div>
</section>

<!-- HUB -->
<section id="hub" class="screen">
  <div class="top-bar" id="hub-topbar"></div>
  <h2 class="hub-title" id="hub-title">Kapitoly</h2>
  <p class="hub-sub" id="hub-sub">Kapitoly se odemykají postupně.</p>
  <div class="hub-grid" id="hub-grid"></div>
  <div id="hub-code-section"></div>
</section>

<!-- CHAPTER -->
<section id="chapter" class="screen">
  <div class="top-bar">
    <a href="javascript:void(0)" id="btn-back-hub">← přehled</a>
    <span id="ch-progress" class="scene-progress"></span>
    <span id="ch-topbar-right"></span>
  </div>
  <div class="chapter-header">
    <span class="chapter-badge" id="ch-badge">Kapitola 1</span>
    <h2 id="ch-title" style="font-size:1.15rem;font-weight:700"></h2>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="ch-prog-fill" style="width:0%"></div></div>
  <div id="scene-container"></div>
</section>

<!-- CERT -->
<section id="cert" class="screen">
  <div class="top-bar" id="cert-topbar"></div>
  <div class="cert">
    <div class="cert-seal">🎓</div>
    <h1 class="cert-title">Hotovo!</h1>
    <p class="cert-sub">Prošel(a) jsi celý průvodce goniometrickými funkcemi.</p>
    <div class="cert-score" id="cert-score">— / —</div>
    <p style="color:var(--muted);font-size:.9rem;margin-top:6px" id="cert-msg"></p>
    <div class="cert-name-input" style="margin-top:16px">
      <input type="text" id="cert-name" placeholder="Zadej své jméno…" maxlength="40" autocomplete="off">
    </div>
  </div>
  <div style="text-align:center;margin-top:16px">
    <button class="btn-primary" id="cert-reset" style="background:linear-gradient(135deg,#6b7280,#4b5563)">↺ Začít znovu</button>
  </div>
</section>

<script>
const STORAGE_KEY = 'goniometrie_v1';
const LANG_KEY = 'goniometrie_lang';
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const rad = deg => deg * Math.PI / 180;
const r1 = x => Math.round(x * 10) / 10;

/* ── i18n ── */
let lang = localStorage.getItem(LANG_KEY) || 'cs';
const i18n = (cs, en) => lang === 'en' ? en : cs;

function setLang(l) {
  lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e) {}
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === l));
  // rebuild current screen
  const activeId = document.querySelector('.screen.active')?.id;
  if (activeId === 'intro') buildIntro();
  else if (activeId === 'hub') { buildHub(); buildHubCode(); }
  else if (activeId === 'chapter') { renderScene(); }
  else if (activeId === 'cert') buildCert();
}

function buildIntro() {
  const cs = lang === 'cs';
  document.getElementById('intro-topbar').innerHTML =
    `<a href="./">${i18n('← zpět na projekty','← back to projects')}</a><span></span><a href="/">${i18n('domů','home')}</a>`;
  document.getElementById('intro-dynamic').innerHTML = `
    <div class="intro-icon">📐</div>
    <h1 class="intro-title">Goniometrie — <span class="accent">sin, cos, tan</span></h1>
    <p class="intro-sub">${cs
      ? 'Výukový průvodce goniometrickými funkcemi pro 9. třídu. Sedm kapitol — od definic přes slovní úlohy až po souhrnný test. Náhodné příklady, 3 úrovně nápovědy.'
      : 'Interactive trigonometry guide for 9th grade. Seven chapters — from definitions through word problems to a final test. Randomised problems, 3-level hints.'}</p>
    <div class="card">
      <h3>${cs ? '📋 Co tě čeká' : '📋 What awaits you'}</h3>
      <ul>
        <li><span class="bullet" style="color:var(--ch1)">①</span><span><b>${cs?'Definice':'Definitions'}</b> — sin, cos, tan ${cs?'v pravoúhlém trojúhelníku a SOHCAHTOA.':'in a right triangle and SOHCAHTOA.'}</span></li>
        <li><span class="bullet" style="color:var(--ch2)">②</span><span><b>${cs?'Výpočet strany':'Side calculation'}</b> — ${cs?'ze zadaného úhlu a jedné strany spočítej druhou.':'find a missing side from a known angle and one side.'}</span></li>
        <li><span class="bullet" style="color:var(--ch3)">③</span><span><b>${cs?'Výpočet úhlu':'Angle calculation'}</b> — arcsin, arccos, arctan.</span></li>
        <li><span class="bullet" style="color:var(--ch4)">④</span><span><b>${cs?'Slovní úlohy — výška':'Word problems — height'}</b> — ${cs?'žebřík, strom, stožár, skluzavka.':'ladder, tree, pole, slide.'}</span></li>
        <li><span class="bullet" style="color:var(--ch5)">⑤</span><span><b>${cs?'Slovní úlohy — vzdálenost':'Word problems — distance'}</b> — ${cs?'délka skluzavky, schodiště, stín, lano.':'staircase, shadow, guy-wire, cliff path.'}</span></li>
        <li><span class="bullet" style="color:var(--ch6)">⑥</span><span><b>${cs?'Úhel sklonu':'Angles of inclination'}</b> — ${cs?'elevační a depresivní úhel: letadlo, hora, maják, drak.':'elevation and depression: aircraft, mountain, lighthouse, kite.'}</span></li>
        <li><span class="bullet" style="color:var(--ch7)">⑦</span><span><b>${cs?'Souhrnný test':'Final test'}</b> — ${cs?'mix příkladů ze všech kapitol, bez nápověd.':'mixed problems from all chapters, no hints.'}</span></li>
      </ul>
    </div>
    <div class="card" style="border-left-color:var(--gold)">
      <h3 style="color:var(--gold)">💡 ${cs?'Pravidla':'Rules'}</h3>
      <ul>
        <li><span class="bullet" style="color:var(--gold)">·</span><span>${cs?'Kalkulačka je v pořádku — jde o postup, ne paměť.':'A calculator is fine — it\'s about the process, not memorisation.'}</span></li>
        <li><span class="bullet" style="color:var(--gold)">·</span><span><b>${cs?'Nápověda má 3 úrovně:':'Hints have 3 levels:'}</b> ${cs?'nasměrování → vzorec → řešení. Postupuješ tlačítkem.':'direction → formula → solution. Click the button.'}</span></li>
        <li><span class="bullet" style="color:var(--gold)">·</span><span>${cs?'Po každé kapitole dostaneš ':'After each chapter you get a '}<b>${cs?'kód':'code'}</b> ${cs?'pro pokračování na jiném počítači.':'to continue on another computer.'}</span></li>
      </ul>
    </div>
    <div class="card">
      <h3>🔑 ${cs?'Mám kód odjinud':'I have a code'}</h3>
      <p style="font-size:.9rem;color:var(--muted);margin-bottom:8px">${cs?'Hraješ na jiném počítači? Zadej kód z předchozí kapitoly.':'Playing on another device? Enter the code from your previous session.'}</p>
      <div class="code-row">
        <input type="text" id="code-input" placeholder="${cs?'např. sohcahtoa':'e.g. sohcahtoa'}" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn-check" id="code-apply">${cs?'Použít':'Apply'}</button>
      </div>
      <div class="code-feedback" id="code-feedback"></div>
    </div>
    <button class="btn-primary" id="btn-start">${cs?'▶ Vstoupit do průvodce':'▶ Enter the guide'}</button>
  `;
  // re-attach intro listeners
  document.getElementById('btn-start').addEventListener('click',()=>{ buildHub(); showScreen('hub'); });
  document.getElementById('code-apply').addEventListener('click',()=>applyCode(document.getElementById('code-input').value,document.getElementById('code-feedback')));
  document.getElementById('code-input').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('code-apply').click(); });
}

function buildHubCode() {
  const cs = lang === 'cs';
  document.getElementById('hub-code-section').innerHTML = `
    <div class="card" style="margin-bottom:0">
      <h3>🔑 ${cs?'Mám kód odjinud':'I have a code'}</h3>
      <div class="code-row">
        <input type="text" id="code-input-hub" placeholder="${cs?'např. sohcahtoa':'e.g. sohcahtoa'}" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn-check" id="code-apply-hub">${cs?'Použít':'Apply'}</button>
      </div>
      <div class="code-feedback" id="code-feedback-hub"></div>
    </div>
  `;
  document.getElementById('code-apply-hub').addEventListener('click',()=>{ applyCode(document.getElementById('code-input-hub').value,document.getElementById('code-feedback-hub')); setTimeout(()=>{buildHub();buildHubCode();},300); });
  document.getElementById('code-input-hub').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('code-apply-hub').click(); });
}

function buildCert() {
  const cs = lang === 'cs';
  let earned=0,max=0;
  for(const id in STATE.scores){ earned+=STATE.scores[id].earned; max+=STATE.scores[id].max; }
  const pct=max>0?Math.round(earned/max*100):0;
  const msg = pct>=80
    ? i18n('Výborně! Goniometrie ti jde skvěle.','Excellent! You really know your trigonometry.')
    : pct>=60
    ? i18n('Dobrá práce! Ještě trochu procvičit a budeš expert.','Good job! A little more practice and you\'ll be an expert.')
    : i18n('Nevadí — projdi si kapitoly znovu, nápovědy ti pomohou.','Never mind — go through the chapters again, the hints will help.');
  document.getElementById('cert-score').textContent=`${earned} / ${max} (${pct} %)`;
  document.getElementById('cert-msg').textContent=msg;
  document.getElementById('cert-name').placeholder=cs?'Zadej své jméno…':'Enter your name…';
  document.getElementById('cert-reset').textContent=cs?'↺ Začít znovu':'↺ Start over';
  document.querySelector('#cert h1').textContent=cs?'Hotovo!':'Completed!';
  document.querySelector('#cert .cert-sub').textContent=cs?'Prošel(a) jsi celý průvodce goniometrickými funkcemi.':'You have completed the full trigonometry guide.';
}

/* SVG triangle — Czech convention.
   Vrcholy:
     A (bottom-left, 30,170) — úhel α zde
     B (top, 200,28) — úhel β zde
     C (bottom-right, 200,170) — pravý úhel (γ = 90°)
   Strany (jméno = malé písmeno protilehlého vrcholu):
     a = strana naproti A = pravá svislá (BC) = protilehlá odvěsna k α
     b = strana naproti B = dolní vodorovná (AC) = přilehlá odvěsna k α
     c = strana naproti C = úhlopříčka (AB) = přepona
   Oblouk α má střed v A, jde z bodu na přilehlé odvěsně (b) do bodu na přeponě (c). */
function svgTriangle(hi={}) {
  const c = {
    a: hi.a ? '#0f8a72' : '#d1c8b8',
    b: hi.b ? '#1a73c8' : '#d1c8b8',
    c: hi.c ? '#7c3aad' : '#d1c8b8',
    al: hi.alpha ? '#d4620a' : '#aaa',
  };
  return `<svg viewBox="0 0 250 200" width="230" height="184" style="max-width:100%">
    <line x1="200" y1="28" x2="200" y2="170" stroke="${c.a}" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="170" x2="200" y2="170" stroke="${c.b}" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="170" x2="200" y2="28" stroke="${c.c}" stroke-width="3.5" stroke-linecap="round"/>
    <polyline points="185,170 185,155 200,155" fill="none" stroke="#aaa" stroke-width="1.8"/>
    <path d="M 52,170 A 22,22 0 0,0 47,156" fill="none" stroke="${c.al}" stroke-width="2.4" stroke-linecap="round"/>
    <text x="213" y="104" fill="${c.a}" font-size="16" font-weight="700" font-family="Lexend,sans-serif">a</text>
    <text x="108" y="188" fill="${c.b}" font-size="16" font-weight="700" font-family="Lexend,sans-serif">b</text>
    <text x="98" y="84" fill="${c.c}" font-size="16" font-weight="700" font-family="Lexend,sans-serif">c</text>
    <text x="62" y="160" fill="${c.al}" font-size="15" font-weight="700" font-family="Lexend,sans-serif">α</text>
    <text x="18" y="176" fill="#aaa" font-size="11" font-family="Lexend,sans-serif">A</text>
    <text x="192" y="24" fill="#aaa" font-size="11" font-family="Lexend,sans-serif">B</text>
    <text x="203" y="186" fill="#aaa" font-size="11" font-family="Lexend,sans-serif">C</text>
  </svg>`;
}

/* ── RENDER ── */
let currentAct=null, currentSceneIdx=0, sceneCtx=null, answered=false;
let chapterScore={earned:0,max:0};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function buildHub() {
  // update top-bar, title, sub
  const tb = document.getElementById('hub-topbar');
  if (tb) tb.innerHTML = `<a href="./">${i18n('← zpět na projekty','← back to projects')}</a><span></span><a href="/">${i18n('domů','home')}</a>`;
  const ht = document.getElementById('hub-title');
  if (ht) ht.textContent = i18n('Kapitoly','Chapters');
  const hs = document.getElementById('hub-sub');
  if (hs) hs.textContent = i18n('Kapitoly se odemykají postupně.','Chapters unlock one by one.');

  const grid=document.getElementById('hub-grid');
  grid.innerHTML='';
  ACTS.forEach(act => {
    const unlocked=STATE.unlocked.includes(act.id);
    const done=STATE.done.includes(act.id);
    const div=document.createElement('div');
    div.className='hub-card'+(done?' done':'')+(unlocked?'':' locked');
    div.innerHTML=`<div class="hub-icon">${act.icon}</div>
      <div class="hub-meta"><h3>${i18n('Kapitola','Chapter')} ${act.id}: ${act.title()}</h3><p>${act.desc()}</p></div>
      <div class="hub-badge ${done?'done':unlocked?'open':'locked'}">${done?i18n('✓ Hotovo','✓ Done'):unlocked?i18n('▶ Hrát','▶ Play'):'🔒'}</div>`;
    if(unlocked) div.addEventListener('click',()=>startAct(act.id));
    grid.appendChild(div);
  });
}

function startAct(id) {
  currentAct=ACTS.find(a=>a.id===id);
  sceneCtx=currentAct.setup();
  currentSceneIdx=0;
  chapterScore={earned:0,max:0};
  const badge=document.getElementById('ch-badge');
  badge.className='chapter-badge '+currentAct.color;
  badge.textContent=i18n('Kapitola','Chapter')+' '+id;
  document.getElementById('ch-title').textContent=currentAct.title();
  document.getElementById('btn-back-hub').textContent=i18n('← přehled','← overview');
  showScreen('chapter');
  renderScene();
}

function renderScene() {
  const scenes=currentAct.scenes;
  answered=false;
  document.getElementById('ch-progress').textContent=`${currentSceneIdx+1} / ${scenes.length}`;
  document.getElementById('ch-prog-fill').style.width=`${(currentSceneIdx/scenes.length)*100}%`;
  const scene=scenes[currentSceneIdx];
  const data=scene.build(sceneCtx);
  const container=document.getElementById('scene-container');
  if(scene.type==='story') renderStory(data,container);
  else if(scene.type==='choice') renderChoice(data,container);
  else renderMath(data,container);
}

function nextScene() {
  currentSceneIdx++;
  if(currentSceneIdx>=currentAct.scenes.length) finishAct();
  else renderScene();
}

function finishAct() {
  STATE.scores[currentAct.id]={...chapterScore};
  if(!STATE.done.includes(currentAct.id)) STATE.done.push(currentAct.id);
  const nextId=currentAct.id+1;
  if(!STATE.unlocked.includes(nextId)&&nextId<=ACTS.length) STATE.unlocked.push(nextId);
  saveState();
  document.getElementById('ch-prog-fill').style.width='100%';
  if(currentAct.id===ACTS.length){ showCert(); return; }
  const code=ACT_CODES[nextId];
  const container=document.getElementById('scene-container');
  container.innerHTML=`<div class="scene-card">
    <h2>🎉 ${i18n('Kapitola','Chapter')} ${currentAct.id} ${i18n('dokončena!','complete!')}</h2>
    <p>${i18n('Skóre:','Score:')} <b>${chapterScore.earned} / ${chapterScore.max}</b></p>
    <div class="code-reveal visible">
      <h3>🔑 ${i18n('Tvůj kód pro kapitolu','Your code for chapter')} ${currentAct.id}</h3>
      <div class="code-val">${code}</div>
      <p>${i18n(`Zapiš si ho — na jiném počítači ho zadáš a budeš pokračovat od kapitoly ${nextId}.`,
                `Write it down — enter it on another device to continue from chapter ${nextId}.`)}</p>
    </div>
    <button class="btn-next visible" id="btn-to-hub" style="margin-top:16px">→ ${i18n('Zpět na přehled','Back to overview')}</button>
  </div>`;
  document.getElementById('btn-to-hub').addEventListener('click',()=>{ buildHub(); buildHubCode(); showScreen('hub'); });
}

function renderStory(data,container) {
  container.innerHTML=`<div class="scene-card">${data.title?`<h2>${data.title}</h2>`:''} ${data.html}</div>
    <button class="btn-next visible" id="btn-story-next">${i18n('Rozumím →','Got it →')}</button>`;
  document.getElementById('btn-story-next').addEventListener('click',nextScene);
}

function renderChoice(data,container) {
  const hasHints=data.hints&&data.hints.length>0;
  const hHtml=hasHints?data.hints.map((h,i)=>`<div class="hint-box ${i===2?'l3':''}" id="hint-${i}">${h}</div>`).join(''):'';
  container.innerHTML=`<div class="scene-card">
    <h2>${data.title}</h2>
    ${data.svg?`<div class="svg-wrap">${data.svg}</div>`:''}
    <p class="problem-q">${data.q}</p>
    <div class="choice-list">${data.choices.map((c,i)=>`<button class="choice-btn" data-idx="${i}">${c}</button>`).join('')}</div>
    <div class="feedback" id="feedback"></div>
    ${hasHints?`<div class="hint-section"><button class="hint-btn" id="hint-toggle">💡 ${i18n('Nápověda','Hint')} 1/3</button>${hHtml}</div>`:''}
  </div>
  <button class="btn-next" id="btn-next">${i18n('Další →','Next →')}</button>`;
  chapterScore.max+=1;
  container.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(answered) return;
      answered=true;
      const ok=parseInt(btn.dataset.idx)===data.correct;
      if(ok) chapterScore.earned+=1;
      container.querySelectorAll('.choice-btn').forEach((b,i)=>{
        b.disabled=true;
        if(i===data.correct) b.classList.add('correct');
        else if(parseInt(b.dataset.idx)===parseInt(btn.dataset.idx)&&!ok) b.classList.add('wrong');
      });
      const fb=container.querySelector('#feedback');
      fb.textContent=ok?i18n('✓ Správně!','✓ Correct!'):i18n('✗ Správně je: ','✗ Correct: ')+data.choices[data.correct];
      fb.className='feedback '+(ok?'ok':'err');
      container.querySelector('#btn-next').classList.add('visible');
    });
  });
  if(hasHints) setupHints(container,data.hints);
  container.querySelector('#btn-next').addEventListener('click',nextScene);
}

function renderMath(data,container) {
  const hasHints=data.hints&&data.hints.length>0;
  const hHtml=hasHints?data.hints.map((h,i)=>`<div class="hint-box ${i===2?'l3':''}" id="hint-${i}">${h}</div>`).join(''):'';
  container.innerHTML=`<div class="scene-card">
    ${data.title?`<h2>${data.title}</h2>`:''}
    ${data.svg?`<div class="svg-wrap">${data.svg}</div>`:''}
    <p class="problem-q">${data.q}</p>
    <div class="input-row">
      <input type="number" class="answer-input" id="ans-input" placeholder="?" step="${data.step||1}">
      <span class="unit-label">${data.unit}</span>
      <button class="btn-check" id="btn-check">${i18n('Zkontrolovat','Check')}</button>
    </div>
    <div class="feedback" id="feedback"></div>
    ${hasHints?`<div class="hint-section"><button class="hint-btn" id="hint-toggle">💡 ${i18n('Nápověda','Hint')} 1/3</button>${hHtml}</div>`:''}
  </div>
  <button class="btn-next" id="btn-next">${i18n('Další →','Next →')}</button>`;
  chapterScore.max+=1;
  const input=container.querySelector('#ans-input');
  const fb=container.querySelector('#feedback');
  const btnNext=container.querySelector('#btn-next');
  function check() {
    if(answered){ nextScene(); return; }
    const val=parseFloat(input.value.replace(',','.'));
    if(isNaN(val)){ fb.innerHTML=i18n('Zadej číslo (desetinnou čárku nebo tečku).','Enter a number (use comma or dot for decimals).'); fb.className='feedback err'; return; }
    const ok=Math.abs(val-data.ans)<=(data.tol||0);
    answered=true;
    if(ok) chapterScore.earned+=1;
    fb.innerHTML=ok
      ? `${i18n('✓ Správně!','✓ Correct!')} ${data.ans} ${data.unit}`
      : `${i18n('✗ Správná odpověď:','✗ Correct answer:')} <b>${data.ans} ${data.unit}</b>`;
    fb.className='feedback '+(ok?'ok':'err');
    input.disabled=true;
    container.querySelector('#btn-check').textContent=i18n('Další →','Next →');
    btnNext.classList.add('visible');
  }
  container.querySelector('#btn-check').addEventListener('click',check);
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
  if(hasHints) setupHints(container,data.hints);
  btnNext.addEventListener('click',nextScene);
}

function setupHints(container,hints) {
  let level=0;
  const btn=container.querySelector('#hint-toggle');
  btn.addEventListener('click',()=>{
    if(level<3){
      container.querySelector(`#hint-${level}`).classList.add('visible');
      level++;
      btn.textContent=level<3?`💡 ${i18n('Nápověda','Hint')} ${level+1}/3`:i18n('✓ Všechny nápovědy zobrazeny','✓ All hints shown');
      if(level===3) btn.disabled=true;
    }
  });
}

function showCert() {
  showScreen('cert');
  // update cert topbar
  const tb=document.getElementById('cert-topbar');
  if(tb) tb.innerHTML=`<a href="./">${i18n('← zpět na projekty','← back to projects')}</a><span></span><a href="/">${i18n('domů','home')}</a>`;
  buildCert();
}

function applyCode(code,feedbackEl) {
  code=code.trim().toLowerCase();
  for(const [nextId,c] of Object.entries(ACT_CODES)){
    if(c===code){
      const id=parseInt(nextId);
      for(let i=1;i<id;i++){ if(!STATE.unlocked.includes(i)) STATE.unlocked.push(i); if(!STATE.done.includes(i)) STATE.done.push(i); }
      if(!STATE.unlocked.includes(id)) STATE.unlocked.push(id);
      saveState();
      feedbackEl.textContent=i18n(`✓ Odemčeno do kapitoly ${id}!`,`✓ Unlocked up to chapter ${id}!`);
      feedbackEl.className='code-feedback ok';
      return;
    }
  }
  feedbackEl.textContent=i18n('✗ Kód není platný.','✗ Invalid code.');
  feedbackEl.className='code-feedback err';
}

loadState();
