
        <defs>
          <filter id="lbl-bg-ua" x="-20%" y="-40%" width="140%" height="180%">
            <feMorphology in="SourceGraphic" operator="dilate" radius="3" result="exp"/>
            <feFlood flood-color="#262626" result="bg"/>
            <feComposite in="bg" in2="exp" operator="in" result="outline"/>
            <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Route polyline -->
        <polyline points="160,80 670,170 660,100 480,240 160,80"
          fill="none" stroke="#f5b800" stroke-width="1.5"
          stroke-dasharray="5 7" opacity="0.55"/>

        <!-- Dots -->
        <circle cx="160" cy="80"  r="5" fill="#f5b800"/>
        <circle cx="670" cy="170" r="4" fill="var(--fg-dim)"/>
        <circle cx="660" cy="100" r="4" fill="var(--fg-dim)"/>
        <circle cx="480" cy="240" r="4" fill="var(--fg-dim)"/>

        <!-- Labels -->
        <g font-family="'JetBrains Mono', monospace"
           font-size="11" letter-spacing="0.12em" filter="url(#lbl-bg-ua)">

          <text x="172" y="75" text-anchor="start" fill="#f5b800">CZ · LIBEREC</text>

          <text x="682" y="166" text-anchor="start" fill="var(--fg-dim)">UA · KYIV</text>
          <text x="682" y="180" text-anchor="start" fill="var(--fg-muted)" font-size="9.5">capital · base</text>

          <text x="672" y="95"  text-anchor="start" fill="var(--fg-dim)">CHERNOBYL</text>
          <text x="672" y="109" text-anchor="start" fill="var(--fg-muted)" font-size="9.5">exclusion zone</text>

          <text x="468" y="246" text-anchor="end"   fill="var(--fg-dim)">CARPATHIANS</text>
          <text x="468" y="260" text-anchor="end"   fill="var(--fg-muted)" font-size="9.5">SW mountains</text>
        </g>
      